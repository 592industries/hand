<!DOCTYPE html>
<!--
  Active theme is set on the <html> element below.
  To switch themes, change `data-theme` to any id defined in src/themes.ts.
  Color values per theme live in src/themes.css.
-->
<html lang="en" data-theme="hand-paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/hand-mark-v1-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/hand-mark-v1-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/hand-mark-v1-180.png" />
    <title>H.A.N.D</title>
    <!--
      First-paint background, keyed to the data-theme attribute above.
      Without this the browser paints white until the CSS bundle arrives —
      a hard flash on the dark themes. Each value mirrors --color-background
      in src/styles.css (slate) / src/themes.css; keep them in sync when
      adding or editing themes.
    -->
    <style>
      html { background-color: #0a0a0a; color-scheme: dark; }
      html[data-theme="paper"] { background-color: #ffffff; color-scheme: light; }
      html[data-theme="hand-paper"] { background-color: #f4f8fc; color-scheme: light; }
      html[data-theme="hand-ink"] { background-color: #060d17; color-scheme: dark; }
      /* Add one line per theme you create, mirroring its --color-background. */
    </style>
    <script>
      try { const theme = localStorage.getItem('hand-theme'); if (theme === 'hand-paper' || theme === 'hand-ink') document.documentElement.dataset.theme = theme } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
