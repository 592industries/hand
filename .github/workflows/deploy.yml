name: Verify and deploy to DeepSpace

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepspace-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSPACE_SESSION: ${{ secrets.DEEPSPACE_SESSION }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.0
          cache: npm

      - name: Use the supported npm version
        run: npm install --global npm@12

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [[ -z "$DEEPSPACE_SESSION" ]]; then
            echo "::error::Missing GitHub Actions secret DEEPSPACE_SESSION"
            exit 1
          fi

      - name: Authenticate with DeepSpace session
        shell: bash
        run: |
          install -d -m 700 "$HOME/.deepspace"
          printf '%s' "$DEEPSPACE_SESSION" > "$HOME/.deepspace/session"
          chmod 600 "$HOME/.deepspace/session"
          npx deepspace auth whoami --json

      - name: Install Chromium and Linux browser libraries
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run the complete DeepSpace test suite
        run: npx deepspace test run all

      - name: Deploy to DeepSpace
        run: npx deepspace deploy --json
