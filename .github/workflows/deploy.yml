name: Verify and deploy to DeepSpace

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepspace-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPSPACE_EMAIL: ${{ secrets.DEEPSPACE_EMAIL }}
      DEEPSPACE_PASSWORD: ${{ secrets.DEEPSPACE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.0
          cache: npm

      - name: Use the supported npm version
        run: npm install --global npm@12

      - name: Install dependencies
        run: npm ci

      - name: Verify deployment credentials
        shell: bash
        run: |
          if [[ -z "$DEEPSPACE_EMAIL" ]]; then
            echo "::error::Missing GitHub Actions secret DEEPSPACE_EMAIL"
            exit 1
          fi
          if [[ -z "$DEEPSPACE_PASSWORD" ]]; then
            echo "::error::Missing GitHub Actions secret DEEPSPACE_PASSWORD"
            exit 1
          fi

      - name: Authenticate with DeepSpace
        run: npx deepspace auth login --json

      - name: Install Chromium and Linux browser libraries
        run: npx playwright install --with-deps chromium

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run the complete DeepSpace test suite
        run: npx deepspace test run all

      - name: Deploy to DeepSpace
        run: npx deepspace deploy --json
